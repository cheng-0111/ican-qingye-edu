<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173b32">
<title>青野智教｜乡村智慧教育平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0c231d;color:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#videoWrap{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#introVideo{width:100%;height:100%;object-fit:contain}
#skipBtn{position:fixed;top:24px;right:24px;z-index:5;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
#skipBtn:hover{background:rgba(255,255,255,0.25)}
#soundBtn{position:fixed;top:24px;right:96px;z-index:5;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
#soundBtn:hover{background:rgba(255,255,255,0.25)}
#enterOverlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,rgba(12,35,29,0.55),rgba(12,35,29,0.85));text-align:center;padding:24px}
#enterOverlay.show{display:flex;animation:fadeIn .8s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#enterOverlay .brand{font-size:34px;font-weight:900;letter-spacing:2px;margin-bottom:8px}
#enterOverlay .slogan{font-size:15px;color:#bcd4ca;margin-bottom:34px;letter-spacing:1px}
#enterBtn{background:#e37342;border:0;color:#fff;font-size:17px;font-weight:800;padding:16px 48px;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px rgba(227,115,66,0.4);transition:all .25s;animation:pulse 2s infinite}
#enterBtn:hover{transform:scale(1.06);box-shadow:0 14px 40px rgba(227,115,66,0.55)}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(227,115,66,0.4)}50%{box-shadow:0 10px 40px rgba(227,115,66,0.7)}}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c231d;z-index:1}
.loading .ring{width:52px;height:52px;border:4px solid rgba(255,255,255,0.15);border-top-color:#e37342;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){
#skipBtn{top:16px;right:14px;font-size:12px;padding:7px 14px}
#soundBtn{top:16px;right:84px;font-size:12px;padding:7px 11px}
#enterOverlay .brand{font-size:26px}
#enterOverlay .slogan{font-size:13px}
#enterBtn{font-size:15px;padding:14px 38px}
}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="ring"></div></div>
<button id="skipBtn" style="display:none">跳过 &gt;&gt;</button>
<button id="soundBtn" style="display:none">🔇</button>
<div id="videoWrap"><video id="introVideo" muted playsinline preload="auto"></video></div>
<div id="enterOverlay">
  <div class="brand">🌿 青野智教</div>
  <div class="slogan">让每一次支教，都能被延续</div>
  <button id="enterBtn">进入网站 →</button>
</div>
<script>
var video=document.getElementById('introVideo');
var overlay=document.getElementById('enterOverlay');
var skipBtn=document.getElementById('skipBtn');
var soundBtn=document.getElementById('soundBtn');
var loading=document.getElementById('loading');
var muted=true;
video.src='intro.mp4';
video.load();
video.addEventListener('canplay',function(){loading.style.display='none';skipBtn.style.display='block';soundBtn.style.display='block';video.play().catch(function(){loading.style.display='none';skipBtn.style.display='block';soundBtn.style.display='block'})});
video.addEventListener('ended',function(){showEnter()});
function showEnter(){overlay.classList.add('show');skipBtn.style.display='none';soundBtn.style.display='none'}
skipBtn.onclick=function(){showEnter()};
soundBtn.onclick=function(){
  muted=!muted;
  video.muted=muted;
  video.volume=1;
  soundBtn.textContent=muted?'🔇':'🔊';
  if(!muted&&video.paused)video.play();
};
document.getElementById('enterBtn').onclick=function(){window.location.href='home.html'};
</script>
</body>
</html>
